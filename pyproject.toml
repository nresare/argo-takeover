[project]
name = "argo-takeover"
version = "0.1.0"
description = "Verify and complete the takeover of Helm releases by Argo CD"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noa Resare" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
argo-takeover = "argo_takeover.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argo_takeover"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
    "types-pyyaml>=6.0.12",
]
